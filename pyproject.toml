[project]
name = "llm-benchmark"
version = "0.1.0"
description = "Estudo comparativo de LLMs: qualidade, latência e custo estimado entre provedores."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
providers = [
    "openai>=1.40",
    "google-genai>=1.0",
    "ollama>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-q"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["llm_benchmark"]
